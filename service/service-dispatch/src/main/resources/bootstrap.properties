spring.application.name=service-dispatch
spring.profiles.active=dev
spring.main.allow-bean-definition-overriding=true
spring.cloud.nacos.discovery.server-addr=192.168.200.6:8848
spring.cloud.nacos.config.server-addr=192.168.200.6:8848
spring.cloud.nacos.config.prefix=${spring.application.name}
spring.cloud.nacos.config.file-extension=yaml
spring.cloud.nacos.config.shared-configs[0].data-id=common.yaml

server.port=8509

# log config
logging.config=classpath:logback-spring.xml


### xxl-job admin address list TODO 如果改为Docker部署 改为部署服务器IP
xxl.job.admin.addresses=http://127.0.0.1:8080/xxl-job-admin
### xxl-job access token TODO
xxl.job.admin.accessToken=default_token
### xxl-job timeout by second, default 3s
xxl.job.admin.timeout=3

### xxl-job executor enable, default true
xxl.job.executor.enabled=true
### xxl-job executor appname TODO 执行名称 用户执行器注册
xxl.job.executor.appname=xxl-job-executor-dispatch
### xxl-job executor registry-address: default use address to registry , otherwise use ip:port if address is null
xxl.job.executor.address=
### xxl-job executor server-info TODO TCP服务端配置
xxl.job.executor.ip=
xxl.job.executor.port=9999
### xxl-job executor log-path
xxl.job.executor.logpath=/data/applogs/xxl-job/jobhandler
### xxl-job executor log-retention-days
xxl.job.executor.logretentiondays=30
### xxl-job executor excluded package, will skip scan job. such as "org.package01" or "org.package01,org.package02"
xxl.job.executor.excludedpackage=
